[project]
name = "mqtt2influxdb"
version = "0.0.1"
description = ""
authors = [
	{ name = "Tobias Müller", email = "Tobias_Mueller@twam.info" }
]
license = "MIT"
requires-python = ">=3.14"
dependencies = [
	"PyYAML>=6.0,<7",
	"aiomqtt>=2.3,<3",
	"influxdb>=5.3.1,<6"
]

[project.scripts]
mqtt2influxdb = 'mqtt2influxdb.mqtt2influxdb:main'

[dependency-groups]
dev= [
	"ruff",
	"pytest",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 320

[tool.ruff.lint]
select = ["F", "E", "W", "I", "N", "UP", "RUF"]
ignore = ["E501"]
